<div class="d-flex align-items-baseline justify-content-between mb-2">
  <span class="fw-semibold">
    Hőmérő {{ state().index + 1 }}
    <code class="small fw-normal">temperature:{{ componentId() }}</code>
  </span>
  @if (state().error) {
    <span class="badge text-bg-danger">Szenzorhiba</span>
  } @else {
    <span class="fs-5 fw-semibold">{{ shown().toFixed(1) }} °C</span>
  }
</div>

<div class="row g-2 align-items-center">
  <div class="col-7">
    <label class="visually-hidden" [for]="fieldId('range')">Hőmérséklet csúszkával</label>
    <input
      type="range"
      class="form-range"
      step="0.1"
      [min]="min"
      [max]="max"
      [id]="fieldId('range')"
      [value]="shown()"
      [disabled]="!!state().error || busy()"
      (input)="drag($event)"
      (change)="commit($event)"
    />
  </div>
  <div class="col-5">
    <label class="visually-hidden" [for]="fieldId('value')">Hőmérséklet (°C)</label>
    <div class="input-group input-group-sm has-validation">
      <input
        type="number"
        class="form-control"
        step="0.1"
        [min]="min"
        [max]="max"
        [id]="fieldId('value')"
        [value]="state().tC ?? ''"
        [disabled]="!!state().error"
        [class.is-invalid]="invalid()"
        (change)="commit($event)"
      />
      <span class="input-group-text">°C</span>
      <div class="invalid-feedback">{{ min }} és {{ max }} °C között.</div>
    </div>
  </div>
</div>

<div class="d-flex align-items-center justify-content-between mt-1">
  <div class="form-check form-switch mb-0 small">
    <input
      class="form-check-input"
      type="checkbox"
      role="switch"
      [id]="fieldId('error')"
      [checked]="!!state().error"
      [disabled]="busy()"
      (change)="toggleError($event)"
    />
    <label class="form-check-label" [for]="fieldId('error')">Szenzorhiba (nincs mérés)</label>
  </div>
  <span class="small text-secondary">
    @if (!state().error) {
      {{ fahrenheit() }} °F ·
    }
    <code>{{ state().address }}</code></span
  >
</div>

@if (error(); as message) {
  <div class="alert alert-danger small py-2 mt-2 mb-0" role="alert">{{ message }}</div>
}
